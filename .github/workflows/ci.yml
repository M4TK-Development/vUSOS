name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore dotnet/Vusos.Linux.slnf
      - run: dotnet build dotnet/Vusos.Linux.slnf --no-restore -c Release
      - run: dotnet test dotnet/Vusos.Linux.slnf --no-build -c Release
  maui-android:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 17
      - run: dotnet workload install maui-android
      - run: dotnet build dotnet/src/Vusos.App -f net10.0-android -c Release
