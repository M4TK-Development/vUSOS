[package]
name = "vusos-desktop"
version = "0.1.0"
description = "vUSOS — jednolita platforma studenta Vistula (desktop)"
authors = ["M4TK <kontakt@m4tk.pl>"]
license = "GPL-3.0"
edition = "2021"

[lib]
name = "vusos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
